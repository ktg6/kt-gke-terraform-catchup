# ArgoCD の PreSync フック: 同期前 (新 Pod 起動前) に DB マイグレーション
apiVersion: batch/v1
kind: Job
metadata:
  name: todo-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10 # 初回は DB 起動待ちで失敗するためリトライ多め
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "false" # sidecar があると Job が終了しない
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["-migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.secretName }}, key: uri }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
