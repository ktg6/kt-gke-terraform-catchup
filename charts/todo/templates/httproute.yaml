# Gateway API の HTTPRoute。Istio が Envoy の設定に変換する
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  rules:
    {{- if .Values.canary.enabled }}
    - matches:
        - headers: [{ name: x-canary, value: "true" }]
      backendRefs: [{ name: todo-canary, port: 80 }]
    {{- end }}
    - backendRefs:
        - name: todo-stable
          port: 80
          weight: {{ if .Values.canary.enabled }}{{ sub 100 .Values.canary.weight }}{{ else }}100{{ end }}
        {{- if .Values.canary.enabled }}
        - name: todo-canary
          port: 80
          weight: {{ .Values.canary.weight }}
        {{- end }}
