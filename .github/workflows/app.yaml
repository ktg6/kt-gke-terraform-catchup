# PR: テストのみ
# main への push: テスト → イメージ build/push → Helm values のタグ更新 (ArgoCD が検知してデプロイ)
name: app

on:
  pull_request:
    paths: ["apps/todo/**", ".github/workflows/app.yaml"]
  push:
    branches: [main]
    paths: ["apps/todo/**", ".github/workflows/app.yaml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/todo }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/todo/go.mod
          cache-dependency-path: apps/todo/go.sum
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write # values.yaml のコミット用
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app/todo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUSH_SA }}
          token_format: access_token # docker login 用の短命トークン
      - name: build & push
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://${IMAGE%%/*}"
          docker build -t "$IMAGE:$GITHUB_SHA" apps/todo
          docker push "$IMAGE:$GITHUB_SHA"
      - name: bump image tag (GitOps)
        run: |
          yq -i '.image.repository = strenv(IMAGE) | .image.tag = strenv(GITHUB_SHA)' charts/todo/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(todo): deploy ${GITHUB_SHA::7}"
          git pull --rebase
          git push
