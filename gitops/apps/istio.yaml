# Istio (サイドカーモード)。データプレーンは Envoy
# sync-wave: 小さい順に同期。CRD を持つ base を先に入れる
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-3" }
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.*
    helm:
      valuesObject:
        defaultRevision: default
  destination: { server: https://kubernetes.default.svc, namespace: istio-system }
  # istiod が実行時に書き換える項目。差分扱いしない (Istio 公式の推奨設定)
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jsonPointers: [/webhooks/0/failurePolicy]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.*
    helm:
      valuesObject:
        # 既定 (500m/2Gi, HPA) は学習用ノードには重いため縮小
        autoscaleEnabled: false
        resources:
          requests: { cpu: 100m, memory: 256Mi }
        global:
          proxy:
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 256Mi }
  destination: { server: https://kubernetes.default.svc, namespace: istio-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
